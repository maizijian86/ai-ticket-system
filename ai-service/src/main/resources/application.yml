server:
  port: 8083
  # 只监听回环。默认绑 0.0.0.0 意味着同网段任何人都能绕过网关直连本服务 ——
  # 而本服务不做鉴权（身份完全依赖网关注入的 X-User-Id），直连即可伪造身份。
  address: 127.0.0.1

spring:
  application:
    name: ai-service

  # 本地密钥文件（已在 .gitignore 中排除），文件不存在时静默跳过
  config:
    import: optional:classpath:application-secret.yml

  datasource:
    url: jdbc:mysql://localhost:3306/aiticket?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: aiticket
    password: aiticket
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

# LangChain4j配置
#
# 注意：DeepSeek 走的是 OpenAI 兼容协议，base-url 必须是 https://api.deepseek.com
# 不要写成 https://api.deepseek.com/anthropic —— 那个前缀是 Anthropic 协议专用，
# 配合 OpenAiChatModel 会请求 /anthropic/chat/completions 并返回 404。
# 密钥来自 application-secret.yml（gitignored）或环境变量 DEEPSEEK_API_KEY
langchain4j:
  open-ai:
    chat-model:
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      api-key: ${DEEPSEEK_API_KEY:}
      model-name: ${DEEPSEEK_MODEL:deepseek-v4-pro}
      log-requests: true
      log-responses: true
    streaming-chat-model:
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      api-key: ${DEEPSEEK_API_KEY:}
      model-name: ${DEEPSEEK_MODEL:deepseek-v4-pro}
      log-requests: true
      log-responses: true

# 知识库文档路径
ai:
  knowledge:
    file: classpath:docs/*.md

# Logging
logging:
  level:
    com.aiticket: DEBUG
    dev.langchain4j: DEBUG
