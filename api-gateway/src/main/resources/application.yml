server:
  port: 8080
  # 只监听回环。网关自身会鉴权，但下游各服务不会 —— 它们也必须绑回环，
  # 否则同网段可以绕过网关直连服务、自行伪造 X-User-Id。
  address: 127.0.0.1

spring:
  main:
    web-application-type: reactive
  application:
    name: api-gateway

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      # 这里必须写 127.0.0.1 字面量，不能写 localhost：各服务的 server.address 已绑回环
      # （只监听 IPv4），而 localhost 在 Windows 上常先解析到 ::1 —— 那时这一跳会
      # 直接 ECONNREFUSED。之前用 localhost 能跑，是因为服务默认绑 0.0.0.0（双栈，
      # IPv6 socket 也接 IPv4 连接），一旦收窄到 127.0.0.1 就没有 IPv6 监听了。
      routes:
        - id: user-service
          uri: http://127.0.0.1:8081
          predicates:
            - Path=/api/v1/auth/**,/api/v1/users/**
        - id: ticket-service
          uri: http://127.0.0.1:8082
          predicates:
            # ProjectController 与 TicketController 同在 ticket-service，
            # 但此前只转发了 /api/v1/tickets/**，/api/v1/projects/** 无人转发，
            # 网关直接回 404 —— 前端整个项目管理模块都因此不可用。
            - Path=/api/v1/tickets,/api/v1/tickets/**,/api/v1/projects,/api/v1/projects/**
        - id: ai-service
          uri: http://127.0.0.1:8083
          predicates:
            - Path=/api/v1/ai/**

  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: aiticket-jwt-secret-key-change-in-production-min-256-bits

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
