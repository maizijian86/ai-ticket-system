server:
  port: 8080
  # 只监听回环。网关自身会鉴权，但下游各服务不会 —— 它们也必须绑回环，
  # 否则同网段可以绕过网关直连服务、自行伪造 X-User-Id。
  address: 127.0.0.1

spring:
  main:
    web-application-type: reactive
  application:
    name: api-gateway

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      # 这里必须写 127.0.0.1 字面量，不能写 localhost：各服务的 server.address 已绑回环
      # （只监听 IPv4），而 localhost 在 Windows 上常先解析到 ::1 —— 那时这一跳会
      # 直接 ECONNREFUSED。之前用 localhost 能跑，是因为服务默认绑 0.0.0.0（双栈，
      # IPv6 socket 也接 IPv4 连接），一旦收窄到 127.0.0.1 就没有 IPv6 监听了。
      routes:
        - id: user-service
          uri: http://127.0.0.1:8081
          predicates:
            - Path=/api/v1/auth/**,/api/v1/users/**
        - id: ticket-service
          uri: http://127.0.0.1:8082
          predicates:
            # 工单与会员/钱包都在 ticket-service，一条谓词全转发。
            #
            # membership 是会员/会员订单（与 UserMembership、额度批次同在 ticket-service，
            # 因为"插一行会员 + 发 30 次次数"必须是同一个本地事务）。回调也走这条路由：
            # natapp 只配一条隧道、回调与其他接口同一个入口，排查时只有一条路径。
            #
            # wallet 同理（钱包/托管/充值，与工单状态变更同一个本地事务）。
            # ⚠️ 它的回调路径必须同时在 JwtAuthenticationFilter 的 WHITE_LIST 里，
            # 否则支付宝那条通知会被 401 挡在最前面。
            #
            # 项目管理那组 /api/v1/projects/** 已随模块下线移除。
            - Path=/api/v1/tickets,/api/v1/tickets/**,/api/v1/membership,/api/v1/membership/**,/api/v1/wallet,/api/v1/wallet/**
        # 此处原有 id: ai-service（8083）的路由，转发 /api/v1/ai/**。
        # 该服务已整个删除：它只有两个接口且无人调用，功能已由 ticket-service 的
        # TicketAiService 覆盖。前端也从未调用过 /api/v1/ai/**（见 api/index.ts 的注释）。

  data:
    redis:
      host: localhost
      port: 6379

jwt:
  # 密钥一律走环境变量，形态与 OSS / DeepSeek 那几项一致。默认值只为"本地克隆下来
  # 就能跑"，形同公开 —— 任何真实部署都必须设 JWT_SECRET，且**与 user-service 用同一个值**
  # （签发与校验分处两个进程，不一致的表现是"登录成功但每个接口都 401"）。
  # 历史：这里以前写的是明文常量，两个服务各抄一份，等于把密钥提交进了仓库。
  secret: ${JWT_SECRET:aiticket-jwt-secret-key-change-in-production-min-256-bits}

logging:
  level:
    # 这两个包原先都是 DEBUG。gateway 那条会逐请求打印路由匹配细节，噪音极大；
    # com.aiticket.gateway 在 DEBUG 下曾把 Authorization 头整条打进日志（见
    # JwtAuthenticationFilter 里那段说明）。排查时临时调回 DEBUG，别长期开着。
    org.springframework.cloud.gateway: INFO
    com.aiticket.gateway: INFO
