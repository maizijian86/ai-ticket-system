server:
  port: 8081
  # 只监听回环。默认绑 0.0.0.0 意味着同网段任何人都能绕过网关直连本服务 ——
  # 而本服务不做鉴权（身份完全依赖网关注入的 X-User-Id），直连即可伪造身份。
  address: 127.0.0.1

spring:
  application:
    name: user-service

  datasource:
    url: jdbc:mysql://localhost:3306/aiticket?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379
      database: 0

jwt:
  secret: aiticket-jwt-secret-key-change-in-production-min-256-bits
  access-token-expiration: 1800000  # 30 minutes
  refresh-token-expiration: 604800000  # 7 days

logging:
  level:
    com.aiticket: DEBUG
    org.springframework.security: INFO
