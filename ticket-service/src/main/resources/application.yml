server:
  port: 8082
  # 只监听回环。默认绑 0.0.0.0 意味着同网段任何人都能绕过网关直连本服务 ——
  # 而本服务不做鉴权（身份完全依赖网关注入的 X-User-Id），直连即可伪造身份。
  address: 127.0.0.1

spring:
  application:
    name: ticket-service

  # 本地密钥文件（已在 .gitignore 中排除），文件不存在时静默跳过
  config:
    import: optional:classpath:application-secret.yml

  datasource:
    url: jdbc:mysql://localhost:3306/aiticket?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: aiticket
    password: aiticket
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

# File upload
file:
  upload-dir: ./uploads

# 支付宝沙箱（会员支付）。密钥类字段的真值放 application-secret.yml（已 gitignore），
# 这里只留 ${...:} 占位引用 —— 没配密钥服务照样能启动，只有"开通会员"那一步不可用。
alipay:
  app-id: ${ALIPAY_APP_ID:}
  private-key: ${ALIPAY_PRIVATE_KEY:}      # 应用私钥（PKCS8，一行到底，不带 BEGIN/END 头尾）
  public-key: ${ALIPAY_PUBLIC_KEY:}        # 沙箱控制台给出的「支付宝公钥」，**不是**应用公钥
  gateway-url: https://openapi-sandbox.dl.alipaydev.com/gateway.do
  sign-type: RSA2
  charset: UTF-8
  # natapp 隧道域名，免费版每次重启都会变。改完要**重启 ticket-service** 才生效，
  # 而且旧的待支付订单不要再付（它带着下单那一刻的 notify-url），重新下单。
  notify-url: ${ALIPAY_NOTIFY_URL:}
  # 付款后浏览器跳回的地址。写 localhost 而不是 127.0.0.1：Vite 只监听 IPv6，
  # 127.0.0.1 会连不上。
  return-url: ${ALIPAY_RETURN_URL:http://localhost:3000/membership/result}

# AI Service (for Feign)
# 同网关：ai-service 的 server.address 已绑回环（仅 IPv4），写 localhost 可能解析到 ::1 而连不上
ai-service:
  url: http://127.0.0.1:8083

# LangChain4j配置
#
# 注意：本服务用 OpenAiChatModel（OpenAI 兼容协议），base-url 必须是
# https://api.deepseek.com。原配置写的 https://api.xiaomimimo.com/anthropic
# 会让请求打到 /anthropic/chat/completions 并返回 404 —— 这正是"下载PRD"
# 一直失败的原因。
# 密钥来自 application-secret.yml（gitignored）或环境变量 DEEPSEEK_API_KEY
langchain4j:
  open-ai:
    chat-model:
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      api-key: ${DEEPSEEK_API_KEY:}
      model-name: ${DEEPSEEK_MODEL:deepseek-v4-pro}
      log-requests: true
      log-responses: true

# Logging
logging:
  level:
    com.aiticket: DEBUG
    dev.langchain4j: DEBUG
