server:
  port: 8082

spring:
  application:
    name: ticket-service

  datasource:
    url: jdbc:mysql://localhost:3306/aiticket?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: aiticket
    password: aiticket
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

# File upload
file:
  upload-dir: ./uploads

# AI Service (for Feign)
ai-service:
  url: http://localhost:8083

# LangChain4j配置
langchain4j:
  open-ai:
    chat-model:
      api-key: sk-sfs0me180haxrdja3fl3ma9uyqtv00h8h6xu23vu6ko0ig4e
      model-name: mimo-v2.5
      base-url: https://api.xiaomimimo.com/anthropic
      log-requests: true
      log-responses: true

# Logging
logging:
  level:
    com.aiticket: DEBUG
    dev.langchain4j: DEBUG
