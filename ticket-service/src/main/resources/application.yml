server:
  port: 8082
  # 只监听回环。默认绑 0.0.0.0 意味着同网段任何人都能绕过网关直连本服务 ——
  # 而本服务不做鉴权（身份完全依赖网关注入的 X-User-Id），直连即可伪造身份。
  address: 127.0.0.1

spring:
  application:
    name: ticket-service

  # 本地密钥文件（已在 .gitignore 中排除），文件不存在时静默跳过
  config:
    import: optional:classpath:application-secret.yml

  datasource:
    # 三个服务连的是同一个库，凭据也统一成同一组、并支持环境变量覆盖
    # （此前 user-service 是 root/1234，这里与 ai-service 是 aiticket/aiticket）。
    url: ${DB_URL:jdbc:mysql://localhost:3306/aiticket?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:aiticket}
    password: ${DB_PASSWORD:aiticket}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

  servlet:
    multipart:
      # 交付物（接单者「去完成」传的压缩包）要过这一层。**这一层是网，不是业务限额**：
      # 真正对用户宣布的数字是 TicketService.DELIVERY_MAX_BYTES（10MB），所以这里要
      # 留出一截余量（12MB），好让 10–12MB 的包落到业务那道检查上 —— 那里给的是
      # 「这个包 11.0 MB，超过了 10.0 MB 上限」这种带数字的人话。
      #
      # 原来两处都写 10MB，结果业务那道**永远轮不到**：Tomcat 先抛，用户拿到的是
      # 500 + 一句英文（实测 11MB 的包）。真超过这 12MB 的，兜底话术在
      # common 的 GlobalExceptionHandler.handleMaxUploadSize 里。
      max-file-size: 12MB
      max-request-size: 50MB

# 阿里云 OSS（交付物上传）
#
# 与 user-service 的同一段配置是**同一套 AK** —— OssStorage 放在 common 就是为了
# "一份 AK 全家用"（见它的类注释）。AK 只从环境变量来：yml 是提交进仓库的，
# 写进去等于泄露，而且是"改一次要改历史提交"的那种泄露。
# 没配 AK 时服务照常启动，只有真正要传文件那一步会报"OSS 未配置"。
aliyun:
  oss:
    endpoint: ${OSS_ENDPOINT:oss-cn-beijing.aliyuncs.com}
    bucket: ${OSS_BUCKET:java-ai-3197}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}

# 支付宝沙箱（会员支付）。密钥类字段的真值放 application-secret.yml（已 gitignore），
# 这里只留 ${...:} 占位引用 —— 没配密钥服务照样能启动，只有"开通会员"那一步不可用。
alipay:
  app-id: ${ALIPAY_APP_ID:}
  private-key: ${ALIPAY_PRIVATE_KEY:}      # 应用私钥（PKCS8，一行到底，不带 BEGIN/END 头尾）
  public-key: ${ALIPAY_PUBLIC_KEY:}        # 沙箱控制台给出的「支付宝公钥」，**不是**应用公钥
  gateway-url: https://openapi-sandbox.dl.alipaydev.com/gateway.do
  sign-type: RSA2
  charset: UTF-8
  # natapp 隧道域名，免费版每次重启都会变。改完要**重启 ticket-service** 才生效，
  # 而且旧的待支付订单不要再付（它带着下单那一刻的 notify-url），重新下单。
  notify-url: ${ALIPAY_NOTIFY_URL:}
  # 付款后浏览器跳回的地址。写 localhost 而不是 127.0.0.1：Vite 只监听 IPv6，
  # 127.0.0.1 会连不上。
  return-url: ${ALIPAY_RETURN_URL:http://localhost:3000/membership/result}

  # 钱包充值的异步通知地址。**必须与会员那个分开**：支付宝只会把通知 POST 到"下单那一刻"
  # 给它的那个 URL，而两个回调处理器各自只认自己单号前缀（MEM / WAL）。
  # 为空时仅充值不可用，会员照常能买（见 AlipayProperties.isWalletConfigured）。
  wallet-notify-url: ${ALIPAY_WALLET_NOTIFY_URL:}
  wallet-return-url: ${ALIPAY_WALLET_RETURN_URL:http://localhost:3000/wallet/result}

# AI Service (for Feign)
# 这段配置已随 AiServiceClient 一起删除：本服务不再调用任何 Feign 客户端。
# AI 能力（PRD / 技术建议 / 任务拆解 / 对话）全部由本服务内的 TicketAiService
# 直接调 DeepSeek 完成，见下面的 langchain4j 配置。

# LangChain4j配置
#
# 注意：本服务用 OpenAiChatModel（OpenAI 兼容协议），base-url 必须是
# https://api.deepseek.com。原配置写的 https://api.xiaomimimo.com/anthropic
# 会让请求打到 /anthropic/chat/completions 并返回 404 —— 这正是"下载PRD"
# 一直失败的原因。
# 密钥来自 application-secret.yml（gitignored）或环境变量 DEEPSEEK_API_KEY
langchain4j:
  open-ai:
    chat-model:
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      api-key: ${DEEPSEEK_API_KEY:}
      model-name: ${DEEPSEEK_MODEL:deepseek-v4-pro}
      log-requests: true
      log-responses: true

# Logging
logging:
  level:
    com.aiticket: DEBUG
    dev.langchain4j: DEBUG
